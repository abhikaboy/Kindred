# Verify Home and tab navigation for a guest after skipping the coach
# Runs from a clean launch; no login needed
appId: com.kindred.kindredtsl
tags:
  - navigation
  - home
---
- launchApp:
    clearState: true

# Skip the Home coach
- assertVisible:
    id: "onboarding-coach-skip"
- tapOn:
    id: "onboarding-coach-skip"

# Home is visible: the guest "Log in" link is on the Home page
- assertVisible:
    id: "guest-login-link"

# Tab bar: the Search tab is hidden (href: null), so it is not asserted
- assertVisible: "Tasks"
- assertVisible: "Feed"
- assertVisible: "Activity"
- assertVisible: "Profile"

# Navigate to Feed tab
- tapOn: "Feed"

# Navigate to Activity tab
- tapOn: "Activity"

# Navigate to Profile tab
- tapOn: "Profile"

# Navigate back to Tasks tab (Home)
- tapOn: "Tasks"
- assertVisible:
    id: "guest-login-link"
