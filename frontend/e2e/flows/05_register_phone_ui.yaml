# Verify the registration flow UI (phone path), reached from a guest's Home
# Does NOT create a real account - stops before OTP verification
appId: com.kindred.kindredtsl
tags:
  - smoke
  - onboarding
  - register
---
- launchApp:
    clearState: true

# Skip the Home coach first
- assertVisible:
    id: "onboarding-coach-skip"
- tapOn:
    id: "onboarding-coach-skip"

# Guest account link opens the sheet in register mode ("Create your account")
- tapOn:
    id: "guest-login-link"

# Register sheet (register mode) with phone option
- assertVisible: "Create your account"
- assertVisible: "Choose how to sign up"
- assertVisible: "Continue with Phone"

# Go to phone registration (pushes /(onboarding)/phone)
- tapOn:
    id: "continue-with-phone"

# Phone onboarding screen
- assertVisible: "What's your phone number?"
- assertVisible: "We'll send you a verification code"

# Terms checkbox should be visible
- assertVisible: "Terms of Service"
- assertVisible: "Privacy Policy"
