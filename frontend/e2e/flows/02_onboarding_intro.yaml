# Verify a fresh launch lands as a guest on Home, where the onboarding v2 coach starts
# The first coach line is "Swipe up to see your workspaces" with a Skip action
appId: com.kindred.kindredtsl
tags:
  - smoke
  - onboarding
---
- launchApp:
    clearState: true

# Guest lands on Home with the first coach step
- assertVisible: "Swipe up to see your workspaces"
- assertVisible:
    id: "onboarding-coach-skip"
