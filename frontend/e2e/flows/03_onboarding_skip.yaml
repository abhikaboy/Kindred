# Verify the coach Skip action dismisses the onboarding v2 coach on Home
appId: com.kindred.kindredtsl
tags:
  - smoke
  - onboarding
---
- launchApp:
    clearState: true

# First coach step shows Skip
- assertVisible: "Swipe up to see your workspaces"
- tapOn:
    id: "onboarding-coach-skip"

# Coach is dismissed and the user stays on Home
- assertNotVisible: "Swipe up to see your workspaces"
