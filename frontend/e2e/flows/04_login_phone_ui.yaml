# Verify the phone login screen UI and navigation, reached from a guest's Home
# NOTE: This does NOT actually send OTP or log in (no real credentials)
appId: com.kindred.kindredtsl
tags:
  - smoke
  - login
---
- launchApp:
    clearState: true

# A fresh launch shows the Home coach; skip it first
- assertVisible:
    id: "onboarding-coach-skip"
- tapOn:
    id: "onboarding-coach-skip"

# Home "Log in" link (guest-login-link) opens the account sheet, not /login
- tapOn:
    id: "guest-login-link"
- assertVisible: "Create your account"

# Switch the sheet to login mode
- tapOn: "Log in"
- assertVisible: "Welcome back"
- assertVisible: "Continue with Phone"

# Go to phone login (pushes /login-phone in login mode)
- tapOn:
    id: "continue-with-phone"

# Phone login screen
- assertVisible: "Login"
- assertVisible: "(555) 123-4567"
- assertVisible: "Send Code"
- assertVisible: "Use a password instead"

# Toggle to password mode
- tapOn:
    id: "toggle-login-mode"
- assertVisible: "Use a verification code instead"
- assertVisible: "Continue"

# Toggle back to OTP mode
- tapOn:
    id: "toggle-login-mode"
- assertVisible: "Send Code"

# Navigate back
- tapOn:
    id: "back-btn"
