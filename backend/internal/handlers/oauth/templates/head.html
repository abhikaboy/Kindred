{{define "head"}}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@300;400;500&display=swap">
<style nonce="{{.Nonce}}">
  :root {
    --bg: #ffffff; --text: #13121f; --caption: #919090; --primary: #854dff;
    --surface: #ffffff; --shadow: 0 8px 32px rgba(19, 18, 31, 0.08), 0 1px 4px rgba(19, 18, 31, 0.06);
    --wash: rgba(133, 77, 255, 0.08); --warn: #b54708;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c1a; --text: #ffffff; --caption: #919090; --surface: #171626;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.45); --wash: rgba(133, 77, 255, 0.16); --warn: #ffb35c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 300; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 520px; padding: 56px 24px 48px; }
  @media (min-width: 720px) { main { margin-left: 12vw; padding-top: 96px; } }
  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 600;
    font-size: 32px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  h2 { font-size: 17px; font-weight: 400; margin: 0 0 12px; }
  p { margin: 0; }
  .caption { color: var(--caption); font-weight: 400; font-size: 14px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 20px; display: block; }
  .host { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 400; }
  .verified { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); font-size: 14px; }
  .verified svg { width: 16px; height: 16px; }
  .unverified { color: var(--warn); font-size: 14px; font-weight: 400; margin-top: 4px; }
  section { margin-top: 36px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; }
  li .title { font-weight: 400; }
  .qr {
    width: 208px; height: 208px; padding: 12px; background: #ffffff; border-radius: 20px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .button {
    display: inline-block; background: var(--primary); color: #ffffff; text-decoration: none;
    font-weight: 400; font-size: 16px; padding: 12px 24px; border-radius: 999px; margin-bottom: 16px;
  }
  .code {
    font-family: "Outfit", ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500;
    font-size: 24px; letter-spacing: 0.12em; color: var(--primary); background: var(--wash);
    padding: 4px 12px; border-radius: 8px; display: inline-block; margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .status { margin-top: 32px; }
  .cancel { color: var(--caption); font-size: 14px; display: inline-block; margin-top: 12px; }
  .touch-only { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .touch-only { display: block; }
    .pointer-only { display: none; }
  }
</style>{{end}}
